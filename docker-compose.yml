services:
  api:
    build: .
    image: elevation-api:1.1.0
    container_name: elevation-api
    ports:
      - "8000:8000"
    environment:
      ELEV_DB_PATH: /data/elev.db
    volumes:
      - elev_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  elev_data:
